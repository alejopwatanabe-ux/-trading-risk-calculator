<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Risk Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Trading Risk Calculator</h1>

    <label>Account Balance ($)</label>
    <input type="number" id="balance" placeholder="10000">

    <label>Risk Per Trade (%)</label>
    <input type="number" id="riskPercent" placeholder="1">

    <label>Stop Loss Distance ($)</label>
    <input type="number" id="stopLoss" placeholder="50">

    <button onclick="calculateRisk()">Calculate</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>

</body>
</html>
